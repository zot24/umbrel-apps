services:
  # The tile opens the manager: token, repositories, runners, recent jobs.
  # PROXY_AUTH_ADD keeps the browser path behind the Umbrel login. The
  # manager also refuses every connection except this app_proxy (by name,
  # APP_PROXY_HOST below), the bridge gateway (the Umbrel host) and loopback,
  # so a sibling app on umbrel_main_network cannot call the API. Never front
  # this app with a public tunnel. 3500 is the only port the app exposes;
  # runners only make outbound connections to GitHub.
  app_proxy:
    environment:
      APP_HOST: zot24-github-runner_manager_1
      APP_PORT: 3500
      PROXY_AUTH_ADD: "true"

  # Where jobs run: a Docker daemon in its own network namespace (the
  # Dockyard / Cursor Sandboxes pattern), so runners never touch the Umbrel
  # host's Docker or other apps. NOT on umbrel_main_network.
  #
  # Two sockets: /sock/docker.sock is shared with the manager; the default
  # /var/run/docker.sock is what the runner mounts into container jobs when
  # Docker for jobs is on. /ghr (job work folders) and
  # /home/runner/externals sit at the same paths the runners use, so a path
  # a runner hands to this daemon names the same files here.
  dind:
    image: docker:28.3.0-dind@sha256:d33eb93fe02683e984e6f8a93c0b3d85bb74f56ec83922bc39fb34ba23ab42bc
    restart: on-failure
    privileged: true
    stop_grace_period: 1m
    networks:
      - ghr_private
    # --mtu 1450 leaves headroom under the 1500 of the network this nests
    # in; --default-network-opt applies it to networks jobs create too.
    command: >
      dockerd
        --host=unix:///sock/docker.sock
        --host=unix:///var/run/docker.sock
        --data-root=/data/data
        --exec-root=/data/exec
        --pidfile=/data/docker.pid
        --mtu=1450
        --default-network-opt=bridge=com.docker.network.driver.mtu=1450
    volumes:
      - ${APP_DATA_DIR}/data/dind:/data
      - ${APP_DATA_DIR}/data/sock:/sock
      - ${APP_DATA_DIR}/data/work:/ghr
      - ${APP_DATA_DIR}/data/externals:/home/runner/externals
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///sock/docker.sock", "info"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Setup page + scheduler. Holds the GitHub token (data/manager/state.json,
  # mode 0600); runners only ever get a single-use JIT config. The code is in
  # the image, not a bind mount: Umbrel app updates do not copy arbitrary
  # files into the data dir. It stays on the default network
  # (umbrel_main_network) so the Umbrel gateway can resolve APP_HOST.
  manager:
    image: ghcr.io/zot24/github-runner-manager:0.1.0@sha256:a4fa2508bc3bb92b62fd14973aa2b840515991e46a98c113cf7e3def8cd5f400
    restart: on-failure
    init: true
    # Long enough to deregister idle runners from GitHub on stop.
    stop_grace_period: 30s
    depends_on:
      dind:
        condition: service_healthy
    environment:
      PORT: "3500"
      DOCKER_SOCK: /sock/docker.sock
      DIND_SOCK_PATH: /sock/docker.sock
      STATE_DIR: /state
      WORK_DIR: /ghr
      EXTERNALS_DIR: /externals
      # The tile's proxy: the one container on umbrel_main_network allowed
      # to talk to the manager. umbreld names it ${APP_ID}_app_proxy_1.
      APP_PROXY_HOST: zot24-github-runner_app_proxy_1
      # What every job runs in: ghcr.io/zot24/github-runner-image (runner/,
      # GitHub's official runner image plus zstd, build-essential and gh),
      # pinned by build-github-runner.yml after each build on main.
      # ci/update-runner.sh bumps its base weekly. The manager pulls exactly
      # this digest into dind.
      RUNNER_IMAGE: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
    volumes:
      - ${APP_DATA_DIR}/data/sock:/sock
      - ${APP_DATA_DIR}/data/manager:/state
      - ${APP_DATA_DIR}/data/work:/ghr
      - ${APP_DATA_DIR}/data/externals:/externals
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3500/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ghr_private is only for dind. Umbrel's common compose file sets `default`
# to the external network umbrel_main_network; manager and app_proxy stay
# there by not listing a network. Do not attach dind to default.
networks:
  ghr_private:
    driver: bridge
