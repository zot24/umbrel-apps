manifestVersion: 1.1
id: zot24-spines
name: Spines
icon: https://raw.githubusercontent.com/zot24/umbrel-apps/main/zot24-spines/icon.svg
category: media
version: "0.1.1"
tagline: A wall of albums and a shelf of books
description: >-
  Spines is one library for music and books. Albums sit as open CD cases.
  The cover is on the left and the disc slides out and plays in the browser.
  Books stand as spines on a plank, colored from their covers, taken from
  the Calibre-Web library on this Umbrel.


  The catalog, generated spines, and cover cache live in this app's data
  folder. Books come from Calibre-Web, mounted read-only. Music defaults to
  Downloads/music and can be pointed at another folder under Downloads.
  Spines does not edit tags, does not download files, and does not replace
  Calibre.
releaseNotes: >-
  0.1.1: Albums show as open CD cases. The cover is on the left and the
  disc slides out and plays in the browser.
developer: zot24
website: https://github.com/zot24/spines
dependencies:
  - calibre-web
repo: https://github.com/zot24/spines
support: https://github.com/zot24/umbrel-apps/issues
