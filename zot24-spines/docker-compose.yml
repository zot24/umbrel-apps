services:
  app_proxy:
    environment:
      APP_HOST: zot24-spines_web_1
      APP_PORT: "8787"

  web:
    # Not published by this change. Umbrel rejects an unpinned image.
    # A later commit, after a human publishes the image, pins ghcr.io/zot24/spines@sha256:...
    image: ghcr.io/zot24/spines:0.1.0
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    restart: on-failure
    init: true
    environment:
      SPINES_DATA: /data
      SPINES_BIND: 0.0.0.0:8787
      SPINES_BOOKS: /books
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Calibre-Web's library, read-only. Same kind of cross-app mount albyhub and mempool use.
      - ${UMBREL_ROOT}/app-data/calibre-web/data/books:/books:ro
      # Music is not mounted. The host folder on this Umbrel is not known.
      # Add a read-only volume and SPINES_MUSIC=/music when that path is confirmed.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
