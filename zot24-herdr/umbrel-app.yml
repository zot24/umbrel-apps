tagline: Terminal multiplexer for AI coding agents — always on, attach from anywhere
description: >-
  Herdr is a terminal multiplexer purpose-built for running AI coding agents
  (Claude Code, Codex, Gemini, and more) in parallel. This app runs a
  persistent Herdr server on your Umbrel so your agents stay alive around the
  clock — detach from your laptop, reattach from your phone, and everything
  is exactly where you left it.


  How you attach:


  - Web: open the app tile. Umbrel login, then the tile password, then a
    setup page for Claude Code / Grok / Kimi / GitHub keys. After that you
    land in the Herdr TUI. The terminal is writable (keyboard works).


  - Phone (Moshi or any SSH client): the app runs its own SSH server on port
    7683, so you connect straight to Herdr — no shell on your Umbrel host and
    no wrapper script. Key authentication only; a bare login drops you in the
    Herdr TUI. Moshi (getmoshi.app) has native Herdr support and is the
    recommended phone client; its session picker works out of the box.


  - Laptop thin client: `herdr --remote <your-umbrel>` over that same SSH
    port, from any machine that has Herdr installed.


  Features:


  - Persistent sessions: the Herdr server runs headless in the container.
    Closing the browser tab only detaches that client — agents keep running.


  - Your data stays home: Herdr config, session state, workspaces, and
    npm-installed agent CLIs all live on the app data volume and survive app
    updates and container rebuilds.


  - Agent-CLI ready: Node.js LTS + npm are preinstalled and global installs
    land on the persistent volume, so `npm install -g
    @anthropic-ai/claude-code` sticks. Git, curl, mosh, and an OpenSSH client
    are included.


  Setup Instructions:


  1. Install the app and open the tile. Log in to Umbrel, then enter the
     password shown on this tile.


  2. Paste API keys (Claude Code, Grok, GitHub, …) on the setup page. They
     are written to this app's data volume. Empty fields leave existing
     values. Skip if you only want the TUI.


  3. Open Herdr. Keep git clones under /data/workspaces so they persist.


  4. For phone access, add an SSH public key on the setup page (or
     SSH_AUTHORIZED_KEYS in data/.env) and restart. Connect on port 7683
     over Tailscale. Never port-forward SSH or expose the web terminal.


  Security notes:


  - The web UI is Umbrel login, then the tile password, then the TUI.
    Do not publish port 7681 or tunnel the app to the public internet.


  - Port 7683 is an SSH shell into this container, published on the Umbrel
    host, so treat it as reachable from your whole LAN. That is safe only
    because there is no password to guess: key authentication only, no root
    login, and the SSH server refuses to start without an authorized key.
    Reach it over Tailscale; never forward it on your router.


  - The SSH server runs as an unprivileged user inside the container. A lost
    key exposes this container — your agents, workspaces, API keys and git
    credentials — but not your Umbrel host.


  - Port 7682 (agent-bridge) is NOT published to the host and is not on the
    app proxy; it is reachable only by sibling containers, authenticated with
    HERDR_AGENT_TOKEN. Treat that token like root on this container.


  - Agent CLIs inside the container can use whatever API keys and git
    credentials you provide. Treat the app data volume like a dev workstation.


  - Herdr is free software (AGPL-3.0) by Oğulcan Çancık:
    https://github.com/ogulcancelik/herdr — https://herdr.dev
releaseNotes: >-
  0.9.0: Web gate in front of the TUI — loading screen, tile password
  (same pattern as Proton Bridge / nworth), then a setup page for Claude
  Code / Grok / Kimi / GitHub / Vercel / Supabase keys. ttyd is now
  writable (the previous build painted the TUI but ignored the keyboard)
  and listens on localhost only. Keys are written to the app data .env.


  0.8.2: Herdr binary 0.7.5 → 0.8.2. Agent-CLI bootstrap now upgrades in place
  on every start (Claude Code, Grok, Kimi, Vercel, Supabase) instead of
  skipping installed bins. Kimi Code PATH includes ~/.kimi-code/bin. Weekly
  GitHub Action checks upstream herdr/ttyd pins and opens a PR when they move.


  0.8.1: adds a built-in SSH server on port 7683, so phones (Moshi) and laptops
  (`herdr --remote`) attach straight to Herdr — no shell on the Umbrel host, no
  wrapper script, and no need to put your user in the docker group. Key
  authentication only: add SSH_AUTHORIZED_KEYS to the app's .env (or a key to
  data/.ssh/authorized_keys) and restart; without a key the SSH server does not
  start. Host key and authorized_keys live on the app data volume, so the
  fingerprint survives app updates. The web terminal (7681) and the Hermes
  agent-bridge (7682) are unchanged.

  0.8.0: internal agent-bridge HTTP API on :7682 for sibling apps (Hermes);
  optional HERDR_BOOTSTRAP_AGENTS installs Claude Code, Grok Build, Kimi Code,
  Vercel CLI, and Supabase CLI onto the persistent volume; GitHub CLI (gh)
  baked into the image; exports APP_ZOT24_HERDR_AGENT_PORT. Web terminal still
  behind Umbrel auth only.

  First Umbrel release, packaging Herdr v0.7.5: headless Herdr server with a
  ttyd web terminal behind Umbrel auth, persistent config / workspaces /
  agent CLIs on the app data volume, mosh + SSH tooling for phone attach,
  and multi-arch images (amd64 + arm64) with sha256-pinned Herdr binaries.
