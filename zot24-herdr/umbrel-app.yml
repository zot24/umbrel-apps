tagline: Terminal multiplexer for AI coding agents — always on, attach from anywhere
description: >-
  Herdr is a terminal multiplexer purpose-built for running AI coding agents
  (Claude Code, Codex, Gemini, and more) in parallel. This app runs a
  persistent Herdr server on your Umbrel so your agents stay alive around the
  clock — detach from your laptop, reattach from your phone, and everything
  is exactly where you left it.


  How you attach:


  - Web terminal (built in): open the app tile for the full Herdr TUI in your
    browser, served by ttyd and protected by your Umbrel login. Works from
    any browser on your network; pair with the Tailscale app for access on
    the go.


  - Phone (Moshi or any SSH client): the app runs its own SSH server on port
    7682, so you connect straight to Herdr — no shell on your Umbrel host and
    no wrapper script. Key authentication only. Moshi (getmoshi.app) has
    native Herdr support and is the recommended phone client; its session
    picker works out of the box.


  - Laptop thin client: `herdr --remote <your-umbrel>` over that same SSH
    port, from any machine that has Herdr installed.


  Features:


  - Persistent sessions: the Herdr server runs headless in the container.
    Closing the browser tab only detaches that client — agents keep running.


  - Your data stays home: Herdr config, session state, workspaces, and
    npm-installed agent CLIs all live on the app data volume and survive app
    updates and container rebuilds.


  - Agent-CLI ready: Node.js LTS + npm are preinstalled and global installs
    land on the persistent volume, so `npm install -g
    @anthropic-ai/claude-code` sticks. Git, curl, mosh, and an OpenSSH client
    are included.


  Setup Instructions:


  1. Install the app and open it — you land in a Herdr TUI.


  2. Install your agent CLIs from the web terminal, e.g. `npm install -g
     @anthropic-ai/claude-code`, then enable session restore with
     `herdr integration install claude` (repeat per agent; check
     `herdr integration status`).


  3. Put API keys in a `.env` file in the app's data directory
     (…/zot24-herdr/data/.env), e.g. `ANTHROPIC_API_KEY=…`, and restart the
     app. Keep your code (git clones) under /data/workspaces so it persists.


  4. For phone / laptop access, authorise an SSH key: add
     `SSH_AUTHORIZED_KEYS=ssh-ed25519 AAAA…` to that same `.env` (use `;`
     between keys for several) or append it to
     …/zot24-herdr/data/.ssh/authorized_keys, then restart the app. Until a
     key exists the SSH server does not start at all.


  5. Install Tailscale on your Umbrel and your phone, then connect to port
     7682 as user `node` — e.g. `ssh -p 7682 node@your-umbrel` — and run
     `herdr`. Never port-forward port 7682 on your router.


  Security notes:


  - Port 7682 is an SSH shell into this container, published on the Umbrel
    host, so treat it as reachable from your whole LAN. That is safe only
    because there is no password to guess: key authentication only, no root
    login, and the SSH server refuses to start without an authorized key.
    Reach it over Tailscale; never forward it on your router.


  - The SSH server runs as an unprivileged user inside the container. A lost
    key exposes this container — your agents, workspaces, API keys and git
    credentials — but not your Umbrel host.


  - The web terminal on port 7681 is read-only (a live view of the TUI) and
    is authenticated by Umbrel's app proxy. Do not publish it or tunnel the
    app to the public internet.


  - Agent CLIs inside the container can use whatever API keys and git
    credentials you provide. Treat the app data volume like a dev workstation.


  - Herdr is free software (AGPL-3.0) by Oğulcan Çancık:
    https://github.com/ogulcancelik/herdr — https://herdr.dev
releaseNotes: >-
  Adds a built-in SSH server on port 7682 so phones (Moshi) and laptops
  (`herdr --remote`) attach straight to Herdr — no shell on the Umbrel host,
  no wrapper script, and no need to put your user in the docker group. Key
  authentication only: add SSH_AUTHORIZED_KEYS to the app's .env (or a key to
  data/.ssh/authorized_keys) and restart; without a key the SSH server does
  not start. Host key and authorized_keys live on the app data volume, so the
  fingerprint survives app updates. An SSH login now also picks up your .env
  secrets and npm-installed agent CLIs. Herdr itself is unchanged at v0.7.5.
