# Local prototype only. Never install this on an Umbrel.
#
# Bound to 127.0.0.1 so the prototype is not reachable from the LAN: unlike the
# real app there is no Umbrel app proxy in front of it, so nothing at all
# authenticates the wizard.

services:
  proto:
    build:
      context: .
    image: herdr-wizard-proto:local
    container_name: herdr-wizard-proto
    init: true
    restart: "no"
    ports:
      - "127.0.0.1:7681:7681"
    environment:
      STATUS_PORT: "7681"
      SSH_PORT: "7682"
      HERDR_DATA_DIR: "/data"
      # Production would set this to the app_proxy hostname so the PTY upgrade
      # can reject requests that did not come through the proxy. Left unset
      # locally, which disables the check — see server.js.
      # APP_PROXY_HOST: "zot24-herdr_server_1"
    volumes:
      - ./scratch-data:/data
