services:
  # The tile opens the manager: credentials, sandbox list, logs, diagnostics.
  # PROXY_AUTH_ADD keeps it behind the Umbrel login. The manager holds your
  # Cursor key and GitHub token, so never front this app with a public tunnel.
  app_proxy:
    environment:
      APP_HOST: zot24-cursor-sandboxes_manager_1
      APP_PORT: 7690
      PROXY_AUTH_ADD: "true"

  # Where sandboxes live: a Docker daemon in its own network namespace (same
  # pattern as Dockyard), so agents never touch the Umbrel host's Docker or
  # other apps. Sandboxes are containers in this daemon; its storage (images,
  # containers, each sandbox's home volume) persists in data/dind.
  dind:
    image: docker:28.3.0-dind@sha256:d33eb93fe02683e984e6f8a93c0b3d85bb74f56ec83922bc39fb34ba23ab42bc
    restart: on-failure
    privileged: true
    stop_grace_period: 1m
    # --mtu 1450 leaves headroom under the 1500 of the network this nests in.
    # The socket gets its own directory so the manager can mount it without
    # seeing the daemon's storage.
    command: >
      dockerd
        --host=unix:///sock/docker.sock
        --data-root=/data/data
        --exec-root=/data/exec
        --pidfile=/data/docker.pid
        --mtu=1450
    volumes:
      - ${APP_DATA_DIR}/data/dind:/data
      - ${APP_DATA_DIR}/data/sock:/sock
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///sock/docker.sock", "info"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Manager: Node standard library only, so it runs on the stock Node image
  # and its code ships in this folder (manager/). It pulls SANDBOX_IMAGE into
  # the private daemon and keeps one container per sandbox in step with
  # data/manager/state.json.
  manager:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    restart: on-failure
    init: true
    depends_on:
      dind:
        condition: service_healthy
    command: ["node", "/app/server.mjs"]
    environment:
      PORT: "7690"
      DOCKER_SOCK: /sock/docker.sock
      DIND_SOCK_PATH: /sock/docker.sock
      STATE_DIR: /state
      # Pinned by .github/workflows/build-cursor-sandboxes.yml on every build
      # of sandbox/. The manager pulls exactly this digest.
      SANDBOX_IMAGE: ghcr.io/zot24/cursor-sandbox-umbrel:0.1.0
    volumes:
      - ${APP_DATA_DIR}/data/sock:/sock
      - ${APP_DATA_DIR}/data/manager:/state
      - ${APP_DATA_DIR}/manager:/app:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7690/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
