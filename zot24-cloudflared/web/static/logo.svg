<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Cloudflare Tunnel">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#0f1a17"/>
      <stop offset="1" stop-color="#060a0d"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <!-- a square tunnel mouth, inner arch, and the lane through it -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="square" filter="url(#glow)">
    <path d="M44 204 V60 H212 V204" stroke="#50ffa8" stroke-width="8"/>
    <path d="M84 204 V120 H172 V204" stroke="#28b870" stroke-width="7"/>
    <path d="M128 120 V204" stroke="#ffc04d" stroke-width="8"/>
  </g>
  <rect width="256" height="256" fill="url(#scan)"/>
</svg>
