id: zot24-cloudflared
name: Cloudflare Tunnel
icon: https://raw.githubusercontent.com/zot24/umbrel-apps-gallery/main/zot24-cloudflared/icon.svg
category: networking
version: "1.1.2"
tagline: Access your Umbrel apps from the Internet using Cloudflare network
description: >-
  Start a secure tunnel to access your Umbrel apps from the Internet using
  the Cloudflare network. This app runs cloudflared, which opens outbound-only
  connections to Cloudflare. You do not open a port on your home router.


  You need a Cloudflare account and a domain on that account. The setup guide,
  with examples for routing an Umbrel app, is at
  https://github.com/Radiokot/umbrel-cloudflared/wiki/How-to-set-up-Cloudflare-Tunnel-on-your-Umbrel


  In the Cloudflare dashboard, point a public hostname at the app's container
  on the Umbrel network, for example
  http://zot24-playwright-renderer_playwright_1:3030. The connector joins that
  network, so it can reach every other app by its container name.


  Apps reachable from the Internet draw scanners and bots. Expose only apps
  that are harmless or that have their own access control. This app's own page
  stays behind the Umbrel login because it holds the tunnel token.


  The UI and the connector started from Radiokot's GPL-3.0 client. Both
  images are built in this repository. When Cloudflare publishes a newer
  cloudflared, the connector checks the release checksum, installs that
  binary, and restarts the tunnel within a few minutes. You do not update
  the app for that. The official Umbrel app id is still
  "cloudflared" on port 4499. This app is "zot24-cloudflared" on port 4500,
  so both can be installed.
releaseNotes: >-
  cloudflared 2026.10.6 -> 2026.10.7. Updating the app pulls the new connector.
