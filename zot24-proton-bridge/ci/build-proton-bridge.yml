name: "Build: Proton Bridge"

# Builds + pushes ghcr.io/zot24/proton-bridge-umbrel for linux/amd64 and
# linux/arm64, then commits the new image+digest back into the app's
# docker-compose.yml so the manifest stays pinned (Umbrel rejects unpinned
# images at install time).
#
# Mirrors build-herdr.yml.

on:
  push:
    branches: [main]
    paths:
      - 'zot24-proton-bridge/bridge/**'
      - '.github/workflows/build-proton-bridge.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. 0.1.0). Leave empty to read umbrel-app.yml.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(grep -E '^version: ' zot24-proton-bridge/umbrel-app.yml | sed -E 's/^version: *"([^"]+)".*/\1/')
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: zot24-proton-bridge/bridge
          file: zot24-proton-bridge/bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zot24/proton-bridge-umbrel:${{ steps.version.outputs.version }}
            ghcr.io/zot24/proton-bridge-umbrel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update docker-compose.yml with new image + digest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/zot24/proton-bridge-umbrel:${VERSION}" --format '{{ .Manifest.Digest }}')
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not determine manifest digest from registry"
            exit 1
          fi
          echo "Manifest digest: $DIGEST"
          sed -i "s|image: ghcr.io/zot24/proton-bridge-umbrel:.*|image: ghcr.io/zot24/proton-bridge-umbrel:${VERSION}@${DIGEST}|" zot24-proton-bridge/docker-compose.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zot24-proton-bridge/docker-compose.yml
          git diff --cached --quiet || git commit -m "chore: update proton-bridge-umbrel image to ${{ steps.version.outputs.version }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done
