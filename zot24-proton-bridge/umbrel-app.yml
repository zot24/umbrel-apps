category: networking
version: "0.1.3"
tagline: Proton Mail IMAP/SMTP bridge for sibling apps on your Umbrel
description: >-
  Runs Proton Mail Bridge as a background IMAP/SMTP gateway on your Umbrel so
  other apps on the box (Hermes + Himalaya, scripts) can read and send mail
  without putting Proton keys inside those apps.


  Proton does not offer direct IMAP. Bridge decrypts locally and speaks IMAP
  on port 143 and SMTP on port 25 inside this container. Those ports are not
  published to the host or the internet. Sibling apps reach them over the
  Umbrel Docker network.


  The app tile is an operator console (ttyd) behind your Umbrel login. First
  run: open the tile, type `login-cli`, sign in with Proton + 2FA, then `info`
  to copy the mailbox password into 1Password. Mail stays up after you close
  the tab.


  Requirements:

  - A paid Proton plan that includes Bridge (Mail Plus or higher). Free
    accounts are refused.

  - You log in once in this app's console. Do not paste Proton passwords into
    chat.


  Security notes:

  - The console is authenticated only by Umbrel's app proxy. Do not publish
    port 7681 or tunnel this app to the public internet.

  - IMAP/SMTP are internal. Do not add host port mappings.

  - This wraps the unofficial shenxn/protonmail-bridge image (Proton Bridge
    is GPL-3.0). Keys live on this app's data volume, not in Hermes.
releaseNotes: >-
  0.1.3: init gpg+pass on start (Bridge refused login with "no keychain").
  0.1.2: host UI port 7685 (7681 is already Herdr). Internal ttyd stays 7681.
