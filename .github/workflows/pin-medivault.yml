name: Pin MediVault image

# The MediVault image is built and published by the source repo
# (zot24/medivault -> .github/workflows/release.yml), so this store never
# needs to build it. Two ways in:
#
#   1. The release workflow fires a `medivault-released` repository_dispatch
#      carrying the version and digest it just pushed. This is the fast path:
#      the app updates on the Umbrel within a minute of the tag.
#   2. A daily poll, as a safety net for a dispatch that never arrived (a
#      missing token, a failed step). It resolves the highest semver tag on
#      the package itself.
#
# The package is public, so an anonymous registry token is enough.

on:
  repository_dispatch:
    types: [medivault-released]
  schedule:
    - cron: '20 2 * * *'  # Daily at 02:20 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and digest to pin
        id: img
        run: |
          set -euo pipefail
          REPO=zot24/medivault

          VER='${{ github.event.client_payload.version }}'
          DIGEST='${{ github.event.client_payload.digest }}'

          if [ -n "$VER" ] && [ -n "$DIGEST" ]; then
            echo "Told about ${VER} directly."
          else
            # Poll: ask the registry what the newest published version is.
            TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO}:pull&service=ghcr.io" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
            VER=$(curl -fsSL -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${REPO}/tags/list" | python3 -c '
          import sys,json,re
          t=json.load(sys.stdin).get("tags",[])
          v=[x for x in t if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",x)]
          v.sort(key=lambda s:list(map(int,s.split("."))))
          print(v[-1] if v else "")')
            if [ -z "$VER" ]; then
              echo "::error::No semver tags on ghcr.io/${REPO} yet — has a release been tagged?"
              exit 1
            fi
            DIGEST=$(curl -fsSL -I -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${REPO}/manifests/${VER}" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          fi

          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VER' is not a plain semver"; exit 1
          fi
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::'$DIGEST' is not a manifest digest"; exit 1
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${REPO}:${VER}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pinning ${VER} -> ${DIGEST}"

      - name: Update compose + manifest if changed
        env:
          # Sent by the source repo's release workflow, taken from the tag's
          # own annotation. Empty on the scheduled poll, which then leaves the
          # existing notes alone rather than replacing them with nothing.
          NOTES: ${{ github.event.client_payload.notes }}
        run: |
          set -euo pipefail
          VER='${{ steps.img.outputs.version }}'
          REF='${{ steps.img.outputs.ref }}'
          sed -i "s|image: ghcr.io/zot24/medivault:.*|image: ${REF}|" zot24-medivault/docker-compose.yml
          python3 - "$VER" <<'PY'
          import os, sys, re
          ver = sys.argv[1]
          p = 'zot24-medivault/umbrel-app.yml'
          s = open(p).read()
          s = re.sub(r'(?m)^version:.*$', f'version: "{ver}"', s, count=1)

          notes = (os.environ.get("NOTES") or "").strip()
          if notes:
              # A literal block scalar keeps the bullet list readable in the
              # update dialog. Every line is indented two spaces, which is
              # what makes the block unambiguous whatever the text contains.
              body = "\n".join("  " + line if line.strip() else ""
                                for line in notes.splitlines())
              s = re.sub(
                  r"(?ms)^releaseNotes:.*?(?=^[a-zA-Z_]+:)",
                  f"releaseNotes: |-\n{body}\n",
                  s,
                  count=1,
              )
          open(p, 'w').write(s)
          open('zot24-medivault/VERSION', 'w').write(ver + "\n")
          PY

          # Fail loudly if the manifest stopped being valid YAML.
          python3 -c "import yaml,sys; yaml.safe_load(open('zot24-medivault/umbrel-app.yml')); print('manifest still valid')"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zot24-medivault/docker-compose.yml zot24-medivault/umbrel-app.yml zot24-medivault/VERSION
          if git diff --cached --quiet; then
            echo "Already pinned to ${{ steps.img.outputs.version }} — nothing to do."
          else
            git commit -m "chore: pin medivault image to ${{ steps.img.outputs.version }}"
            git pull --rebase origin main && git push
          fi
