name: "Build: GitHub Runner"

# Builds + pushes two images for linux/amd64 and linux/arm64:
#   ghcr.io/zot24/github-runner-manager   (the tile + scheduler)
#   ghcr.io/zot24/github-runner-image     (what every job runs in: GitHub's
#                                          ghcr.io/actions/actions-runner plus
#                                          zstd, build-essential, gh and the
#                                          Docker Compose plugin)
# then pins both digests into docker-compose.yml (manager `image:`, and
# RUNNER_IMAGE in both compose files) in one commit.
#
# The runner image's base is pinned in runner/Dockerfile and bumped by
# update-github-runner.yml. Merging that PR rebuilds and re-pins here.
#
# Pull requests run the tests and build both images without pushing, so a
# change is proven to build before it reaches main. Nothing is pinned then.
#
# Both packages must be public: the Umbrel pulls them unauthenticated. New
# GHCR packages are private. The visibility step tries to flip them; if the
# token cannot, the log says so and the install will 401 until you set the
# package public by hand.
#
# Mirrors build-cursor-sandboxes.yml.

on:
  push:
    branches: [main]
    paths:
      - 'zot24-github-runner/manager/**'
      - 'zot24-github-runner/runner/**'
      - '.github/workflows/build-github-runner.yml'
  pull_request:
    paths:
      - 'zot24-github-runner/**'
      - '.github/workflows/build-github-runner.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. 0.1.0). Leave empty to read umbrel-app.yml.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # Pull requests only build; main pushes, pins and commits.
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit and scheduler tests
        run: node --test zot24-github-runner/manager/lib.test.mjs zot24-github-runner/manager/test/scheduler.test.mjs

      - name: Determine version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(grep -E '^version: ' zot24-github-runner/umbrel-app.yml | sed -E 's/^version: *"([^"]+)".*/\1/')
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manager
        uses: docker/build-push-action@v6
        with:
          context: zot24-github-runner/manager
          file: zot24-github-runner/manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/zot24/github-runner-manager:${{ steps.version.outputs.version }}
            ghcr.io/zot24/github-runner-manager:latest
          cache-from: type=gha,scope=github-runner-manager
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=github-runner-manager' || '' }}

      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: zot24-github-runner/runner
          file: zot24-github-runner/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/zot24/github-runner-image:${{ steps.version.outputs.version }}
            ghcr.io/zot24/github-runner-image:latest
          cache-from: type=gha,scope=github-runner-image
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=github-runner-image' || '' }}

      - name: Make GHCR packages public
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in github-runner-manager github-runner-image; do
            if gh api --method PATCH -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${name}" -f visibility=public >/dev/null; then
              echo "public: $name"
            else
              echo "::warning::Could not set $name public. Umbrel pulls are unauthenticated and will 401 until the package is public (GitHub > Packages > Package settings > Change visibility)."
            fi
          done

      - name: Pin image digests in docker-compose.yml
        if: env.PUBLISH == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Ask the registry for the manifest-list digest; build-push-action's
          # digest output can be a single platform's (see build-herdr.yml).
          digest_of() {
            local d
            d=$(docker buildx imagetools inspect "ghcr.io/zot24/$1:${VERSION}" --format '{{ .Manifest.Digest }}')
            if [ -z "$d" ]; then
              echo "::error::Could not determine manifest digest for $1" >&2
              exit 1
            fi
            echo "$1: $d" >&2
            echo "$d"
          }
          manager=$(digest_of github-runner-manager)
          runner=$(digest_of github-runner-image)
          sed -i "s|image: ghcr.io/zot24/github-runner-manager:.*|image: ghcr.io/zot24/github-runner-manager:${VERSION}@${manager}|" zot24-github-runner/docker-compose.yml
          for f in zot24-github-runner/docker-compose.yml zot24-github-runner/docker-compose.local.yml; do
            sed -i "s|RUNNER_IMAGE: .*|RUNNER_IMAGE: ghcr.io/zot24/github-runner-image:${VERSION}@${runner}|" "$f"
            grep -nE 'image:|RUNNER_IMAGE:' "$f"
          done

      - name: Commit and push
        if: env.PUBLISH == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zot24-github-runner/docker-compose.yml zot24-github-runner/docker-compose.local.yml
          git diff --cached --quiet || git commit -m "chore: pin github-runner images to ${{ steps.version.outputs.version }}"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              ok=1
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Failed to push the image digest pins"
            exit 1
          fi
