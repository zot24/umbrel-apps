name: "Build: Cursor Sandboxes"

# Builds + pushes ghcr.io/zot24/cursor-sandbox-umbrel (the image every
# sandbox runs) for linux/amd64 and linux/arm64, then pins the new
# image+digest into SANDBOX_IMAGE in the app's docker-compose.yml. The
# manager pulls exactly that digest into the app's private Docker daemon.
#
# The package must be public: the pull runs on the Umbrel, unauthenticated.
#
# Mirrors build-herdr.yml.

on:
  push:
    branches: [main]
    paths:
      - 'zot24-cursor-sandboxes/sandbox/**'
      - '.github/workflows/build-cursor-sandboxes.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. 0.1.0). Leave empty to read umbrel-app.yml.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(grep -E '^version: ' zot24-cursor-sandboxes/umbrel-app.yml | sed -E 's/^version: *"([^"]+)".*/\1/')
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: zot24-cursor-sandboxes/sandbox
          file: zot24-cursor-sandboxes/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zot24/cursor-sandbox-umbrel:${{ steps.version.outputs.version }}
            ghcr.io/zot24/cursor-sandbox-umbrel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin SANDBOX_IMAGE in docker-compose.yml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Ask the registry for the manifest-list digest; build-push-action's
          # digest output can be a single platform's (see build-herdr.yml).
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/zot24/cursor-sandbox-umbrel:${VERSION}" --format '{{ .Manifest.Digest }}')
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not determine manifest digest from registry"
            exit 1
          fi
          echo "Manifest digest: $DIGEST"
          sed -i "s|SANDBOX_IMAGE: ghcr.io/zot24/cursor-sandbox-umbrel:.*|SANDBOX_IMAGE: ghcr.io/zot24/cursor-sandbox-umbrel:${VERSION}@${DIGEST}|" zot24-cursor-sandboxes/docker-compose.yml
          grep -n 'SANDBOX_IMAGE:' zot24-cursor-sandboxes/docker-compose.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zot24-cursor-sandboxes/docker-compose.yml
          git diff --cached --quiet || git commit -m "chore: update cursor-sandbox-umbrel image to ${{ steps.version.outputs.version }}"
          # Retry with rebase in case remote moved during the build
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done
