services:
  # The Umbrel tile (manifest port 25752) opens the read-only web UI,
  # behind the dashboard login (PROXY_AUTH_ADD=true). Docker clients
  # must not use the tile URL. They should use the published host
  # port 25750 (Mac, CI runners) or the docker-cache alias on the
  # Umbrel network (sibling containers).
  #
  # These ports must stay different. umbrelOS binds 127.0.0.1 to the
  # manifest port, and also redirects LAN traffic on that port to the
  # tile. Port 25750 is a direct publish of the registry. It does not
  # go through app_proxy, so the Umbrel login never applies to it.
  # Turning PROXY_AUTH_ADD on or off changes only the tile, not 25750.
  app_proxy:
    environment:
      APP_HOST: zot24-docker-cache_ui_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "true"

  registry:
    # Official CNCF Distribution registry, multi-arch index digest.
    # Umbrel rejects an image with no digest. Verified with crane:
    #   crane digest registry:3.1.2
    image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    restart: on-failure
    stop_grace_period: 1m
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_PROXY_TTL: 168h
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_LOG_LEVEL: info
    volumes:
      - ${APP_DATA_DIR}/data/registry:/var/lib/registry
    ports:
      - "25750:5000"
    networks:
      default:
        aliases:
          - docker-cache
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:5000/v2/",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ui:
    # Joxit docker-registry-ui, multi-arch index digest.
    # Umbrel rejects an image with no digest. Verified with crane:
    #   crane digest joxit/docker-registry-ui:2.6.0
    # No host port: the UI is only reached through app_proxy.
    # It talks to the registry on the compose network, not on 25750.
    image: joxit/docker-registry-ui:2.6.0@sha256:bb5956a6b378706f1c3a92c947d0a0c606e280460cd9e37c0198caf46399c839
    restart: on-failure
    stop_grace_period: 30s
    environment:
      SINGLE_REGISTRY: "true"
      DOCKER_REGISTRY_UI_TITLE: Docker Hub Cache
      REGISTRY_TITLE: Docker Hub Cache
      NGINX_PROXY_PASS_URL: http://registry:5000
      NGINX_RESOLVER: 127.0.0.11
      DELETE_IMAGES: "false"
      ENABLE_VERSION_NOTIFICATION: "false"
      SHOW_CATALOG_NB_TAGS: "true"
      CATALOG_DEFAULT_EXPANDED: "true"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:80/",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
