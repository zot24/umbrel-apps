version: "2.3.3"
tagline: An isolated Docker host for Komodo to deploy into
description: >-
  Dockyard is a deploy target for Komodo that lives on your Umbrel: a Docker
  daemon running in its own network namespace, with a Komodo Periphery agent
  in front of it. Point your Komodo at it as a server and deploy stacks here.


  Why it exists: Umbrel's own Komodo app runs its bundled Docker-in-Docker in
  host network mode, which makes two Docker daemons fight over one set of
  firewall rules — so containers it deploys can't talk to each other. Dockyard
  runs the nested daemon in its own namespace instead, so networking works
  the way Docker intends, while staying fully isolated from your Umbrel's own
  Docker and your other apps.


  Think of it as a VPS that happens to be a container on your NAS: Komodo is
  your control panel, Dockyard is where the workloads actually run. Keeping
  them in separate apps means you can update or replace either one without
  disturbing the other.


  A stack you deploy here reaches the outside world by publishing a port; that
  port becomes available on Dockyard's own address on the Umbrel network, so a
  Cloudflare Tunnel can point straight at it.
