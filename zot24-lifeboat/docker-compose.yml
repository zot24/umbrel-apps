services:
  # The tile opens Lifeboat's page. PROXY_AUTH_ADD keeps it behind the Umbrel
  # login. Lifeboat also refuses every peer except this proxy (APP_PROXY_HOST
  # below), the Umbrel host (it fetches the home-screen widget) and loopback,
  # so a sibling app on umbrel_main_network cannot start a restore.
  app_proxy:
    environment:
      APP_HOST: zot24-lifeboat_lifeboat_1
      APP_PORT: 7746
      PROXY_AUTH_ADD: "true"

  # Settings are LIFEBOAT_* variables in <app-data>/data/.env (KEY=VALUE,
  # read on every start), or Docker secrets of the same names. The restic
  # repository, the storage mirror and restores live in data/lifeboat.
  lifeboat:
    image: ghcr.io/zot24/lifeboat:0.1.0@sha256:ca0344c13751594a47f51ac469796f8dc0240f34bb614b0b1e439f2dc05ae03f
    restart: on-failure
    init: true
    stop_grace_period: 1m
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
    environment:
      APP_PROXY_HOST: zot24-lifeboat_app_proxy_1
    volumes:
      - ${APP_DATA_DIR}/data/lifeboat:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7746/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
